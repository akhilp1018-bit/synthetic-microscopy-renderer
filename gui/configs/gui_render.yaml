input:
  mode: single_mesh
  mesh_path: data/mesh_001/mesh_001.ply
  scale_to_nm: 1.0
  recenter: false
output:
  output_dir: outputs/gui_results
  output_name: gui_render
grid:
  xy_um_per_px: 0.094
  z_step_um: 0.5
  use_roi: false
  roi_size_um_x: 150.0
  roi_size_um_y: 150.0
  margin: 0.05
  shape_mode: fixed
  output_shape_zyx:
  - 256
  - 512
  - 512
  roi_world_to_local_4x4:
  - - -0.43447280164843866
    - 0.008389936176666838
    - -0.9006458758017672
    - 1165458.7273297342
  - - -0.5970714707719804
    - -0.7513510574095957
    - 0.28102890833474564
    - 2578658.7553111603
  - - -0.6743434165304029
    - 0.6598493748580639
    - 0.3314509904669256
    - 907352.0968226496
  - - 0.0
    - 0.0
    - 0.0
    - 1.0
renderer:
  method: voxel_grid
  labeling_mode: membrane
  voxel_grid:
    labeling_mode: membrane
    spacing_nm: 100
    batch_faces: 2048
    filled_closing_iterations: 1
splatting:
  spacing_nm: 100
  sigma_tangent_nm: 100.0
  sigma_normal_nm: 50.0
  apply_psf: true
  seed: 0
  points_per_batch: 50000
psf:
  mode: gaussian_2p
  path: psfs/psf_bornwolf_488nm_NA1_xy94nm_z500nm_65x65x13.tif
  shape_zyx:
  - 13
  - 65
  - 65
  excitation_lambda_nm: 920.0
  na: 1.0
  refractive_index: 1.33
  sigma_scale_xy: 1.0
  sigma_scale_z: 1.0
noise:
  enabled: false
  peak_photons: 500.0
  read_noise_std: 5.0
  seed: 0
  gaussian_chunk_slices: 16
masks:
  object_rel_threshold: 0.1
  spine_rel_threshold: 0.1
  dendrite_rel_threshold: 0.1
  save_individual_spine_masks: false
  save_clean_component_images: false
