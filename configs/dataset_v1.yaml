# Reproducible command from repository root:
#
#   PYTHONPATH=. python scripts/generate_dataset.py --config configs/dataset_v1.yaml
#
# This config is intended for dataset generation only, not scripts/render.py.

dataset:
  name: synthetic_dataset_v1
  output_dir: outputs/synthetic_dataset_v1

  splits:
    train: 100
    validation: 20
    test: 20

samples:
  sample_001:
    enabled: true
    split: train
    labelled_dir: data/sample_001
    scale_to_nm: 1000000.0

  sample_002:
    enabled: true
    split: validation
    labelled_dir: data/sample_002
    scale_to_nm: 10000.0

  sample_003:
    enabled: true
    split: test
    labelled_dir: data/sample_003
    scale_to_nm: 1000.0

  sample_004:
    enabled: true
    split: train
    labelled_dir: data/sample_004
    scale_to_nm: 1.0

generation:
  location: geometry_random
  random_orientation: true
  seed: 0

grid:
  output_shape_zyx: [64, 128, 128]
  xy_um_per_px: 0.094
  z_step_um: 0.5

renderer:
  method: voxel_grid
  labeling_mode: membrane

  voxel_grid:
    spacing_nm: 200
    batch_faces: 2048
    labeling_mode: membrane
    filled_closing_iterations: 1

splatting:
  spacing_nm: 200
  sigma_tangent_nm: 100.0
  sigma_normal_nm: 50.0
  apply_psf: true
  seed: 0
  points_per_batch: 50000

psf:
  mode: gaussian_2p
  excitation_lambda_nm: 920.0
  na: 1.0
  refractive_index: 1.33
  shape_zyx: [13, 65, 65]
  sigma_scale_xy: 1.0
  sigma_scale_z: 1.0

noise:
  enabled: true
  mode: poisson_gaussian
  peak_photons: 500.0
  read_noise_std: 5.0
  gaussian_chunk_slices: 16

masks:
  dendrite_rel_threshold: 0.1
  spine_rel_threshold: 0.1
  save_individual_spine_masks: false

output:
  image_bit_depth: 8
  save_clean: true
  save_noisy: true
  save_dendrite_mask: true
  save_spine_mask: true
  save_combined_mask: true
  save_metadata: true
