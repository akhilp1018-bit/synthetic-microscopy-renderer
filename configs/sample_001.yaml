# ============================================================
# Synthetic Microscopy Renderer Configuration
# ============================================================
#
# Reproducible command from repository root:
#
#   PYTHONPATH=. python scripts/render.py --config configs/sample_001.yaml
#
# Coordinate convention:
#   Mesh coordinates : XYZ, converted to nanometres by scale_to_nm.
#   Output arrays     : ZYX [Z slices, Y pixels, X pixels].
#
# ============================================================


input:
  # ------------------------------------------------------------
  # Input
  # ------------------------------------------------------------
  #
  # Options:
  #   single_mesh
  #   labelled_components
  #
  mode: labelled_components

  # Used only when mode: single_mesh.
  mesh_path: data/mesh_001/mesh_001.ply

  # Used when mode: labelled_components.
  labelled_dir: data/sample_001
  dendrite_pattern: dendrite*.ply
  spine_pattern: spine*.ply

  # Known tested scale factors:
  #   mesh_001   : 1.0
  #   sample_001 : 1000000.0
  #   sample_002 : 10000.0
  #   sample_003 : 1000.0
  #   sample_004 : 1.0
  scale_to_nm: 1000000.0

  recenter: false


output:
  # ------------------------------------------------------------
  # Output
  # ------------------------------------------------------------

  output_dir: outputs/sample_001/gaussian_2p_voxelgrid_membrane
  output_name: sample_001


grid:
  # ------------------------------------------------------------
  # Spatial sampling
  # ------------------------------------------------------------

  # 94 nm per pixel in XY.
  xy_um_per_px: 0.094

  # 500 nm between Z slices.
  z_step_um: 0.5

  # ------------------------------------------------------------
  # Region of interest
  # ------------------------------------------------------------

  use_roi: false

  # Used only when use_roi: true.
  roi_size_um_x: 150.0
  roi_size_um_y: 150.0

  margin: 0.05

  # ------------------------------------------------------------
  # Output shape
  # ------------------------------------------------------------
  #
  # auto:
  #   Determine the volume size from the prepared mesh bbox.
  #
  # fixed:
  #   Use output_shape_zyx exactly.
  #
  shape_mode: auto

  # Used only when shape_mode: fixed.
  # Order: [Z, Y, X]
  output_shape_zyx: [64, 128, 128]


renderer:
  # ------------------------------------------------------------
  # Rendering method
  # ------------------------------------------------------------
  #
  # Options:
  #
  #   voxel_grid
  #     Mesh surface is sampled into a voxel fluorescence-density
  #     representation before PSF convolution.
  #
  #   gaussian_splatting
  #     Mesh surface points are represented by normal-oriented
  #     anisotropic Gaussian splats.
  #
  method: voxel_grid

  # Used by gaussian_splatting.
  # Gaussian surface splatting currently represents membrane
  # fluorescence only.
  labeling_mode: membrane

  # ------------------------------------------------------------
  # Voxel-based fluorescence rendering
  # ------------------------------------------------------------

  voxel_grid:
    # Options:
    #
    #   membrane
    #     Surface fluorescence density.
    #
    #   filled
    #     Approximate volume fluorescence obtained from the
    #     voxelized surface using closing and hole filling.
    #
    labeling_mode: membrane

    # Approximate surface sampling spacing in nanometres.
    spacing_nm: 200

    # Number of mesh faces processed per batch.
    batch_faces: 2048

    # Used only when labeling_mode: filled.
    filled_closing_iterations: 1


splatting:
  # ------------------------------------------------------------
  # Gaussian surface splatting
  # ------------------------------------------------------------
  #
  # Used only when:
  #   renderer.method: gaussian_splatting
  #

  # Approximate surface-point sampling spacing in nanometres.
  spacing_nm: 200

  # Anisotropic Gaussian widths in physical nanometres.
  sigma_tangent_nm: 100.0
  sigma_normal_nm: 50.0

  # Apply microscope PSF after constructing the splatted
  # fluorescence-density volume.
  apply_psf: true

  # Reproducible surface-point sampling.
  seed: 0

  # Number of sampled points processed per batch.
  points_per_batch: 50000


psf:
  # ------------------------------------------------------------
  # Point spread function
  # ------------------------------------------------------------
  #
  # Supported modes:
  #
  #   bornwolf
  #     Load the Fiji-generated Born-Wolf PSF directly.
  #     No additional squaring is performed.
  #
  #   gaussian_2p
  #     Generate an analytical Gaussian approximation of the
  #     two-photon excitation PSF.
  #
  mode: gaussian_2p

  # ------------------------------------------------------------
  # Born-Wolf PSF
  # ------------------------------------------------------------
  #
  # Used only when:
  #   mode: bornwolf
  #
  # This file corresponds to 94 nm XY and 500 nm Z sampling.
  #
  path: psfs/psf_bornwolf_488nm_NA1_xy94nm_z500nm_65x65x13.tif

  # ------------------------------------------------------------
  # Analytical two-photon Gaussian PSF
  # ------------------------------------------------------------
  #
  # Used only when:
  #   mode: gaussian_2p
  #

  shape_zyx: [13, 65, 65]

  # Two-photon excitation wavelength.
  excitation_lambda_nm: 920.0

  na: 1.0
  refractive_index: 1.33



noise:
  # ------------------------------------------------------------
  # Microscopy noise
  # ------------------------------------------------------------
  #
  # Noise is applied only to the rendered image.
  # Ground-truth masks are generated from clean component volumes.
  #

  enabled: false

  peak_photons: 500.0
  read_noise_std: 5.0

  # Reproducible noise realization.
  seed: 0

  gaussian_chunk_slices: 16


masks:
  # ------------------------------------------------------------
  # Ground-truth masks
  # ------------------------------------------------------------
  #
  # Thresholds are relative to the maximum intensity of each
  # clean rendered component.
  #

  # Used only in single_mesh mode.
  object_rel_threshold: 0.1

  # Used in labelled_components mode.
  spine_rel_threshold: 0.1
  dendrite_rel_threshold: 0.1

  # Save one mask for every individual spine.
  save_individual_spine_masks: false

  # Save clean dendrite/spine component images.
  save_clean_component_images: false
