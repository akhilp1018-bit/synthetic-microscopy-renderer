# ============================================================
# Synthetic Microscopy Renderer Configuration
# ============================================================
#
# This configuration renders synthetic microscopy volumes from
# neuronal mesh geometry.
#
# Reproducible command from repository root:
#
#   PYTHONPATH=. python scripts/render.py --config configs/mesh_001.yaml
#
# Coordinate convention:
#   Mesh coordinates : XYZ, converted to nanometres by scale_to_nm.
#   Output arrays     : ZYX [Z slices, Y pixels, X pixels].
#
# ============================================================


input:
  # ------------------------------------------------------------
  # Input
  # ------------------------------------------------------------
  #
  # Options:
  #   single_mesh
  #   labelled_components
  #
  mode: single_mesh

  # Used when mode: single_mesh.
  mesh_path: data/mesh_001/mesh_001.ply

  # Used when mode: labelled_components.
  labelled_dir: data/sample_002
  dendrite_pattern: dendrite*.ply
  spine_pattern: spine*.ply

  # Mesh coordinate conversion to nanometres.
  #
  # Known tested scale factors:
  #   mesh_001   : 1.0
  #   sample_001 : 1000000.0
  #   sample_002 : 10000.0
  #   sample_003 : 1000.0
  #   sample_004 : 1.0
  #
  scale_to_nm: 1.0

  # Keep false when meshes already share a meaningful
  # physical coordinate system.
  recenter: false


output:
  # ------------------------------------------------------------
  # Output
  # ------------------------------------------------------------

  output_dir: outputs/mesh_001/gaussian_2p_voxelgrid_membrane_fixed
  output_name: mesh_001


grid:
  # ------------------------------------------------------------
  # Spatial sampling
  # ------------------------------------------------------------

  # 94 nm per pixel in XY.
  xy_um_per_px: 0.094

  # 500 nm between Z slices.
  z_step_um: 0.5

  # ------------------------------------------------------------
  # Region of interest
  # ------------------------------------------------------------

  # false = use the full mesh bounding box before placing
  #         the fixed rendering grid.
  #
  # true  = use a centred XY ROI.
  #
  use_roi: false

  # Used only when use_roi: true.
  roi_size_um_x: 100.0
  roi_size_um_y: 100.0

  # Relative margin around the mesh bounding box.
  margin: 0.05

  # ------------------------------------------------------------
  # Output shape
  # ------------------------------------------------------------
  #
  # Options:
  #   auto
  #   fixed
  #
  shape_mode: fixed

  # Order: [Z, Y, X]
  output_shape_zyx: [64, 128, 128]


renderer:
  # ------------------------------------------------------------
  # Rendering method
  # ------------------------------------------------------------
  #
  # Options:
  #
  #   voxel_grid
  #     Surface-area-weighted mesh sampling into a voxel
  #     fluorescence-density volume.
  #
  #   gaussian_splatting
  #     Surface points represented by normal-oriented
  #     anisotropic Gaussian splats.
  #
  method: voxel_grid

  # Used by gaussian_splatting.
  # Gaussian surface splatting currently represents
  # membrane/surface fluorescence.
  labeling_mode: membrane

  # ------------------------------------------------------------
  # Voxel-based fluorescence rendering
  # ------------------------------------------------------------

  voxel_grid:
    # Options:
    #
    #   membrane
    #     Surface fluorescence density.
    #
    #   filled
    #     Approximate volume fluorescence obtained from
    #     the voxelized surface using closing and hole filling.
    #
    labeling_mode: membrane

    # Approximate mesh-surface sampling spacing in nanometres.
    spacing_nm: 200

    # Number of mesh faces processed per batch.
    batch_faces: 2048

    # Used only for filled rendering.
    filled_closing_iterations: 1


splatting:
  # ------------------------------------------------------------
  # Gaussian surface splatting
  # ------------------------------------------------------------
  #
  # Used only when:
  #
  #   renderer.method: gaussian_splatting
  #

  # Approximate surface-point sampling spacing in nanometres.
  spacing_nm: 200

  # Anisotropic Gaussian widths in physical nanometres.
  #
  # tangent:
  #   width along the membrane surface.
  #
  # normal:
  #   width perpendicular to the membrane surface.
  #
  sigma_tangent_nm: 100.0
  sigma_normal_nm: 50.0

  # Apply microscope PSF after constructing the
  # Gaussian-splatted fluorescence-density volume.
  apply_psf: true

  # Reproducible surface-point sampling.
  seed: 0

  # Number of sampled points processed per batch.
  points_per_batch: 50000


psf:
  # ------------------------------------------------------------
  # Point spread function
  # ------------------------------------------------------------
  #
  # Supported modes:
  #
  #   bornwolf
  #     Load the Fiji-generated Born-Wolf PSF directly.
  #     No PSF squaring is performed.
  #
  #   gaussian_2p
  #     Generate an analytical Gaussian approximation
  #     of a two-photon excitation PSF.
  #
  mode: gaussian_2p

  # ------------------------------------------------------------
  # Born-Wolf PSF
  # ------------------------------------------------------------
  #
  # Used only when:
  #
  #   mode: bornwolf
  #
  # This PSF matches:
  #   wavelength = 488 nm
  #   NA         = 1.0
  #   XY         = 94 nm
  #   Z          = 500 nm
  #
  path: psfs/psf_bornwolf_488nm_NA1_xy94nm_z500nm_65x65x13.tif

  # ------------------------------------------------------------
  # Analytical two-photon Gaussian PSF
  # ------------------------------------------------------------
  #
  # Used only when:
  #
  #   mode: gaussian_2p
  #

  shape_zyx: [13, 65, 65]

  # Two-photon excitation wavelength in nanometres.
  excitation_lambda_nm: 920.0

  na: 1.0
  refractive_index: 1.33

  # Optional calibration factors.


noise:
  # ------------------------------------------------------------
  # Microscopy noise
  # ------------------------------------------------------------
  #
  # Noise is applied only to the rendered image.
  # Ground-truth masks are generated from the clean signal.
  #

  enabled: false

  # Photon-count scale for Poisson noise.
  peak_photons: 500.0

  # Standard deviation of Gaussian read noise.
  read_noise_std: 5.0

  # Reproducible noise realization.
  # Use null for non-deterministic noise.
  seed: 0

  # Number of Z slices processed together when
  # generating Gaussian noise.
  gaussian_chunk_slices: 16


masks:
  # ------------------------------------------------------------
  # Ground-truth mask generation
  # ------------------------------------------------------------
  #
  # Thresholds are relative to the maximum intensity of the
  # corresponding clean rendered component.
  #

  # Used for single_mesh.
  object_rel_threshold: 0.1

  # Used for labelled_components.
  spine_rel_threshold: 0.1
  dendrite_rel_threshold: 0.1

  # Optional instance-level spine masks.
  save_individual_spine_masks: false

  # Optional clean dendrite/spine images.
  save_clean_component_images: false
