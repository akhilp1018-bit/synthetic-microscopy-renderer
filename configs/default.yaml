# ============================================================
# Synthetic Microscopy Renderer Configuration
# ============================================================
#
# Reproducible command from repository root:
#
#   PYTHONPATH=. python scripts/render.py --config configs/default.yaml
#
# Coordinate convention:
#   Mesh coordinates: XYZ, interpreted in nanometres after scale_to_nm.
#   Output image/mask stacks: ZYX, saved as TIFF.
# ============================================================


input:
  # Options:
  #   single_mesh
  #   labelled_components
  mode: single_mesh

  # Used when mode: single_mesh.
  mesh_path: data/mesh_001/mesh_001.ply

  # Used when mode: labelled_components.
  labelled_dir: data/sample_002
  dendrite_pattern: dendrite*.ply
  spine_pattern: spine*.ply

  # Mesh coordinate conversion to nanometres.
  #
  # Known tested scale factors:
  #   mesh_001   : 1.0
  #   sample_001 : 1000000.0
  #   sample_002 : 10000.0
  #   sample_003 : 1000.0
  #   sample_004 : 1.0
  scale_to_nm: 1.0

  recenter: false


output:
  output_dir: outputs/mesh_001/gaussian_2p_gaussian_splatting_membrane
  output_name: mesh_001


grid:
  # XY pixel size in micrometres per pixel.
  xy_um_per_px: 0.094

  # Z spacing in micrometres.
  z_step_um: 0.5

  # false = use full mesh bounding box
  # true  = use centered XY ROI
  use_roi: false

  roi_size_um_x: 150.0
  roi_size_um_y: 150.0

  margin: 0.05

  # Options:
  #   auto
  #   fixed
  shape_mode: fixed

  # Order: [Z, Y, X]
  output_shape_zyx: [64, 128, 128]


renderer:
  # Options:
  #   voxel_grid
  #   gaussian_splatting
  method: gaussian_splatting

  # Gaussian splatting currently supports membrane only.
  # This top-level setting is used by the Gaussian renderer.
  labeling_mode: membrane

  # ------------------------------------------------------------
  # Voxel renderer settings
  # ------------------------------------------------------------
  voxel_grid:
    # Options:
    #   membrane
    #   filled
    labeling_mode: membrane

    # Approximate surface sampling spacing in nanometres.
    spacing_nm: 200

    # Number of mesh faces processed per batch.
    batch_faces: 2048

    # Used for filled interior filling.
    filled_closing_iterations: 1


splatting:
  # ------------------------------------------------------------
  # Gaussian surface splatting settings
  # ------------------------------------------------------------

  # Surface sampling spacing in nanometres.
  spacing_nm: 200

  # Anisotropic Gaussian widths in physical nanometres.
  # Tangential sigma acts along the membrane surface.
  # Normal sigma acts perpendicular to the membrane surface.
  sigma_tangent_nm: 100.0
  sigma_normal_nm: 50.0

  # Apply microscope PSF after splatting.
  apply_psf: true

  # Reproducible surface sampling.
  seed: 0

  # Number of sampled points processed per batch.
  points_per_batch: 50000


psf:
  # ------------------------------------------------------------
  # Point spread function
  # ------------------------------------------------------------
  #
  # Options:
  #
  #   bornwolf
  #     Load the Fiji-generated Born-Wolf PSF directly.
  #
  #   gaussian_2p
  #     Generate the analytical Gaussian approximation of the
  #     two-photon excitation PSF.
  #
  mode: gaussian_2p

  # ------------------------------------------------------------
  # Born-Wolf PSF
  # ------------------------------------------------------------
  #
  # Used only when mode: bornwolf.
  # The PSF sampling must match the rendered image sampling.
  #
  # For xy_um_per_px: 0.094:
  #   psfs/psf_bornwolf_488nm_NA1_xy94nm_z500nm_65x65x13.tif
  #
  path: psfs/psf_bornwolf_488nm_NA1_xy94nm_z500nm_65x65x13.tif

  # ------------------------------------------------------------
  # Analytical Gaussian two-photon PSF
  # ------------------------------------------------------------
  #
  # Used only when mode: gaussian_2p.
  #
  shape_zyx: [13, 65, 65]

  # Two-photon excitation wavelength.
  excitation_lambda_nm: 920.0

  na: 1.0
  refractive_index: 1.33

  sigma_scale_xy: 1.0
  sigma_scale_z: 1.0


noise:
  # ------------------------------------------------------------
  # Noise model
  # ------------------------------------------------------------

  enabled: false

  peak_photons: 500.0
  read_noise_std: 5.0

  # Reproducible noise realization.
  seed: 0

  gaussian_chunk_slices: 16


masks:
  # ------------------------------------------------------------
  # Ground-truth mask thresholds
  # ------------------------------------------------------------

  object_rel_threshold: 0.1
  spine_rel_threshold: 0.1
  dendrite_rel_threshold: 0.1

  save_individual_spine_masks: false
  save_clean_component_images: false
