# ============================================================
# Week 5 - Photon Count and Noise Test
# ============================================================
#
# Purpose:
#   Test the effect of photon count and microscopy noise on the
#   same synthetic two-photon rendering.
#
# Keep mesh, renderer, sampling, and PSF settings unchanged
# between tests. Only change:
#   - noise.mode
#   - noise.peak_photons
#   - noise.read_noise_std
#   - noise.seed
#   - output directory/name
#
# Noise conditions:
#   Clean              : enabled = false
#   Poisson only       : mode = poisson
#   Poisson + Gaussian : mode = poisson_gaussian
#
# Photon levels:
#   Low    = 100
#   Medium = 500
#   High   = 2000


input:
  mode: single_mesh
  mesh_path: data/mesh_001/mesh_001.ply
  scale_to_nm: 1.0
  recenter: false


output:
  output_dir: outputs/noise_tests/clean
  output_name: mesh_001_clean1


grid:
  xy_um_per_px: 0.094
  z_step_um: 0.5
  use_roi: false
  roi_size_um_x: 150.0
  roi_size_um_y: 150.0
  margin: 0.05
  shape_mode: fixed
  output_shape_zyx: [64, 128, 128]


renderer:
  method: voxel_grid
  labeling_mode: membrane
  voxel_grid:
    spacing_nm: 200
    batch_faces: 2048
    labeling_mode: membrane
    filled_closing_iterations: 1
splatting:
  spacing_nm: 200
  sigma_tangent_nm: 100.0
  sigma_normal_nm: 50.0
  apply_psf: true
  seed: 0
  points_per_batch: 50000


  sigma_tangent_nm: 100.0
  sigma_normal_nm: 50.0
psf:
  mode: gaussian_2p
  path: psfs/psf_bornwolf_488nm_NA1_xy94nm_z500nm_65x65x13.tif
  shape_zyx: [13, 65, 65]
  na: 1.0
  refractive_index: 1.33
  sigma_scale_xy: 1.0
  sigma_scale_z: 1.0


  excitation_lambda_nm: 920.0
noise:
  enabled: true
  mode: poisson_gaussian
  peak_photons: 500.0
  read_noise_std: 0.0
  seed: 0
  gaussian_chunk_slices: 16


masks:
  object_rel_threshold: 0.1
  spine_rel_threshold: 0.1
  dendrite_rel_threshold: 0.1
  save_individual_spine_masks: false
  save_clean_component_images: false
