# ============================================================
# Gaussian Only Std 100
# ============================================================
# Independent Gaussian-only noise. Signal scale fixed at 500; Gaussian std = 100.
#
# Fixed across experiments:
#   - mesh: data/mesh_001/mesh_001.ply
#   - output volume: [64, 128, 128] (ZYX)
#   - XY sampling: 0.094 um/pixel
#   - Z step: 0.5 um
#   - renderer: voxel_grid
#   - labeling: membrane
#   - PSF: gaussian_2p
#
# peak_photons is a relative synthetic signal/photon-budget scale.
# It is not an experimentally calibrated absolute photon count.
#
# Run from the repository root:
#   python scripts/render.py --config configs/noise/gaussian_std100.yaml
# ============================================================

input:
  mode: single_mesh
  mesh_path: data/mesh_001/mesh_001.ply
  scale_to_nm: 1.0
  recenter: false
output:
  output_dir: outputs/noise_tests/gaussian_std100
  output_name: mesh_001_gaussian_std100
grid:
  xy_um_per_px: 0.094
  z_step_um: 0.5
  use_roi: false
  roi_size_um_x: 150.0
  roi_size_um_y: 150.0
  margin: 0.05
  shape_mode: fixed
  output_shape_zyx:
  - 64
  - 128
  - 128
renderer:
  method: voxel_grid
  labeling_mode: membrane
  voxel_grid:
    spacing_nm: 200
    batch_faces: 2048
    labeling_mode: membrane
    filled_closing_iterations: 1
splatting:
  spacing_nm: 200
  apply_psf: true
  seed: 0
  points_per_batch: 50000
  sigma_tangent_nm: 100.0
  sigma_normal_nm: 50.0
psf:
  mode: gaussian_2p
  path: psfs/psf_bornwolf_488nm_NA1_xy94nm_z500nm_65x65x13.tif
  shape_zyx:
  - 13
  - 65
  - 65
  na: 1.0
  refractive_index: 1.33
  sigma_scale_xy: 1.0
  sigma_scale_z: 1.0
  excitation_lambda_nm: 920.0
noise:
  enabled: true
  mode: gaussian
  peak_photons: 500.0
  read_noise_std: 100.0
  seed: 0
  gaussian_chunk_slices: 16
masks:
  object_rel_threshold: 0.1
  spine_rel_threshold: 0.1
  dendrite_rel_threshold: 0.1
  save_individual_spine_masks: false
  save_clean_component_images: false
